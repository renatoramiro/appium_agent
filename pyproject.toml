[project]
name = "appium-agent"
version = "0.1.0"
description = "Agente mobile QA que testa apps Android via Appium (MCP) usando a lib agno."
requires-python = ">=3.10"
dependencies = [
    "agno>=2.8",
    "mcp>=1.2,<2.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[tool.uv]
package = false